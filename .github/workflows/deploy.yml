name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `workflow_run` runs in this repository's context with this repository's secrets, and the
    # `branches:` filter above matches the *triggering* run's head branch — a name whoever opened
    # the pull request chose. CI runs on `pull_request`, so without the two checks below a fork
    # branch called `main` with passing CI would deploy its own commit with the deploy key in
    # scope. The guard is on the job, not a step: a step-level `if` still lets earlier steps run
    # with the secrets already loaded.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    timeout-minutes: 10

    permissions:
      contents: read
      deployments: write

    env:
      AKAMAI_HOST_KEY: ${{ secrets.AKAMAI_HOST_KEY }}
      APP_HOST: ${{ secrets.APP_HOST }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      LITESTREAM_KNOWN_HOSTS_HOST_PATH: ${{ secrets.LITESTREAM_KNOWN_HOSTS_HOST_PATH }}
      LITESTREAM_REPLICA_ROOT: ${{ secrets.LITESTREAM_REPLICA_ROOT }}
      LITESTREAM_SSH_KEY_HOST_PATH: ${{ secrets.LITESTREAM_SSH_KEY_HOST_PATH }}
      LITESTREAM_SFTP_HOST: ${{ secrets.LITESTREAM_SFTP_HOST }}
      LITESTREAM_SFTP_USER: ${{ secrets.LITESTREAM_SFTP_USER }}
      METRICS_BIND_IP: ${{ secrets.METRICS_BIND_IP }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      WG_MAINFRAME_IP: ${{ secrets.WG_MAINFRAME_IP }}

    steps:
      # Every one of these reaches config/deploy.yml through ERB, where a missing value renders as
      # an empty string rather than an error. An empty METRICS_BIND_IP makes the accessory ports
      # ":9397:9394", which binds 0.0.0.0, and Docker's published ports are DNAT'd past the host
      # firewall. So this runs before anything is checked out or any connection is made.
      - name: Preflight required secrets
        # The deploy key is read here rather than in the job's environment, so that only this step
        # and the ssh-agent step below can see it.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for var in AKAMAI_HOST_KEY APP_HOST DEPLOY_HOST DEPLOY_SSH_PORT LITESTREAM_KNOWN_HOSTS_HOST_PATH LITESTREAM_REPLICA_ROOT LITESTREAM_SFTP_HOST LITESTREAM_SFTP_USER LITESTREAM_SSH_KEY_HOST_PATH METRICS_BIND_IP RAILS_MASTER_KEY SSH_PRIVATE_KEY WG_MAINFRAME_IP; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret/var $var is empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.DEPLOY_SHA,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Deploy ${process.env.DEPLOY_SHA.slice(0, 7)} to production`
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Expose GitHub Actions cache for Docker
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The host key is baked rather than scanned. An ssh-keyscan on every deploy trusts whatever
      # answers on the day, which is the one thing knowing the fingerprint in advance is for.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '[%s]:%s %s\n' "$DEPLOY_HOST" "$DEPLOY_SSH_PORT" "$AKAMAI_HOST_KEY" >> ~/.ssh/known_hosts
          printf '%s\n' \
            "Host $DEPLOY_HOST" \
            "  Port $DEPLOY_SSH_PORT" \
            "  ServerAliveInterval 15" \
            "  ServerAliveCountMax 4" \
            >> ~/.ssh/config

      # The lockfile pins the version this application's configuration was written against, so the
      # deploy uses that one rather than whatever `gem install kamal` resolves to today.
      - name: Deploy
        run: bundle exec kamal deploy

      - name: Verify deployment
        run: ssh "deploy@$DEPLOY_HOST" "docker ps --filter label=service=deures --filter status=running --format '{{.Names}}'" | grep -q "$DEPLOY_SHA"

      - name: Mark deployment successful
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'success',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              environment_url: `https://${process.env.APP_HOST}`
            });

      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.deployment_id
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Notify Slack (success)
        if: success()
        run: |
          if [ -z "$SLACK_DEPLOY_SUCCESS_WEBHOOK" ]; then
            echo "SLACK_DEPLOY_SUCCESS_WEBHOOK not set; skipping notification"; exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ Deploy successful for deures"}' \
            "$SLACK_DEPLOY_SUCCESS_WEBHOOK"
        env:
          SLACK_DEPLOY_SUCCESS_WEBHOOK: ${{ secrets.SLACK_DEPLOY_SUCCESS_WEBHOOK }}

      - name: Notify Slack (failure)
        if: failure()
        run: |
          if [ -z "$SLACK_DEPLOY_FAILURE_WEBHOOK" ]; then
            echo "SLACK_DEPLOY_FAILURE_WEBHOOK not set; skipping notification"; exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Deploy FAILED for deures"}' \
            "$SLACK_DEPLOY_FAILURE_WEBHOOK"
        env:
          SLACK_DEPLOY_FAILURE_WEBHOOK: ${{ secrets.SLACK_DEPLOY_FAILURE_WEBHOOK }}
