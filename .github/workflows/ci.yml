name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# The gate only reads the tree. A public repository hands this token to every fork's pull
# request, so it gets the narrowest scope that still lets the checkout happen.
permissions:
  contents: read

jobs:
  # The groups are not listed here. config/ci.rb is the gate AGENTS.md names, and a second list
  # of steps in this file drifts from it silently: the seeds and the operations listing were
  # missing from this file for exactly as long as it had steps of its own. So this job asks that
  # file what its groups are called, and the matrix below runs one job per answer.
  groups:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.read.outputs.groups }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the groups out of config/ci.rb
        id: read
        run: echo "groups=$(bin/ci --groups)" >> "$GITHUB_OUTPUT"

  gate:
    needs: groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    name: ${{ matrix.group }}
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop  # Standard runs RuboCop underneath, and caches where it is told

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ruby-vips loads the native library when the app boots, not when a variant is asked for,
      # so every group needs it even though none of them make an image. The runtime image
      # installs the same package.
      - name: Install libvips
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Prepare RuboCop cache
        if: matrix.group == 'style'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.standard.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run the gate
        run: bin/ci ${{ matrix.group }}

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && matrix.group == 'system'
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
